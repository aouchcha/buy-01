services:
  users-mongodb:
    image: mongo:latest
    profiles:
      - infra
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${USERS_DB_NAME}
    volumes:
      - users_mongo_data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: >
        mongosh --quiet
        -u $$MONGO_INITDB_ROOT_USERNAME
        -p $$MONGO_INITDB_ROOT_PASSWORD
        --authenticationDatabase admin
        --eval "db.adminCommand('ping')"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - buy01-network

  products-mongodb:
    image: mongo:latest
    profiles:
      - infra
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${PRODUCTS_DB_NAME}
    volumes:
      - products_mongo_data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: >
        mongosh --quiet
        -u $$MONGO_INITDB_ROOT_USERNAME
        -p $$MONGO_INITDB_ROOT_PASSWORD
        --authenticationDatabase admin
        --eval "db.adminCommand('ping')"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - buy01-network

  media-mongodb:
    image: mongo:latest
    profiles:
      - infra
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${MEDIA_DB_NAME}
    volumes:
      - media_mongo_data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: >
        mongosh --quiet
        -u $$MONGO_INITDB_ROOT_USERNAME
        -p $$MONGO_INITDB_ROOT_PASSWORD
        --authenticationDatabase admin
        --eval "db.adminCommand('ping')"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - buy01-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    profiles:
      - infra
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    expose:
      - "2181"
    networks:
      - buy01-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    profiles:
      - infra
    depends_on:
      - zookeeper
    expose:
      - "29092"
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - buy01-network

  jenkins-master:
    build: ./Backend/jenkins/master
    profiles:
      - infra
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    expose:
      - "8080"
      - "50000"
    networks:
      - buy01-network
    volumes:
      - jenkins_home:/var/jenkins_home
      - /run/user/${USER_ID}/docker.sock:/var/run/docker.sock
      # Bind-mount (not baked COPY) so the JCasC config actually applied always matches
      # the committed file, even when the jenkins_home named volume already existed
      # from a previous run and would otherwise mask the image's copy of this file.
      - ./Backend/jenkins/master/jenkins.yaml:/var/jenkins_home/casc_configs/jenkins.yaml:ro

  backend-slave:
    build: ./Backend/jenkins/backend-slave
    profiles:
      - infra
    env_file:
      - .env
    environment:
      JENKINS_URL: http://jenkins-master:8080
      JENKINS_AGENT_NAME: backend-slave
      JENKINS_SECRET: ${BACKEND_SLAVE_SECRET}
      # Overrides the host-oriented SONAR_HOST_URL that env_file pulls in from .env.
      # That value (localhost:9000) is only correct from the Docker host; inside this
      # container SonarQube is reachable as `sonarqube`. withSonarQubeEnv() masks the
      # difference inside its own block, so a wrong value here fails only the sonar
      # commands that run outside it — set it correctly rather than rely on that.
      SONAR_HOST_URL: http://sonarqube:9000
    volumes:
      - /run/user/${USER_ID}/docker.sock:/var/run/docker.sock
      # .env must be mode 0644 on the host, not 0600. Docker here is rootless,
      # so the host uid owning .env maps to uid 0 inside the container while the
      # agent runs as uid 1000 — it therefore matches only the "other" bits, and
      # 0600 makes this file unreadable. The pipeline needs it for
      # `docker compose --env-file` and for the deploy stage's workspace copy,
      # which fail with "open /home/jenkins/.env: permission denied".
      # Confidentiality still rests on /home/<user> being 0700, not on this mode.
      - ./.env:/home/jenkins/.env
    group_add:
      - "999"
    depends_on:
      jenkins-master:
        condition: service_started
    networks:
      - buy01-network

  frontend-slave:
    build: ./Backend/jenkins/frontend-slave
    profiles:
      - infra
    env_file:
      - .env
    environment:
      JENKINS_URL: http://jenkins-master:8080
      JENKINS_AGENT_NAME: frontend-slave
      JENKINS_SECRET: ${FRONTEND_SLAVE_SECRET}
      # See the note on backend-slave: .env's SONAR_HOST_URL points at localhost,
      # which resolves to this container rather than to SonarQube.
      SONAR_HOST_URL: http://sonarqube:9000
    volumes:
      - /run/user/${USER_ID}/docker.sock:/var/run/docker.sock
      # Same 0644 requirement as backend-slave — see the note there.
      - ./.env:/home/jenkins/.env
    group_add:
      - "999"
    depends_on:
      jenkins-master:
        condition: service_started
    networks:
      - buy01-network

  sonarqube-db:
    image: postgres:17
    profiles:
      - infra
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${SONARQUBE_DB_NAME}
      POSTGRES_USER: ${SONARQUBE_DB_USERNAME}
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - buy01-network

  sonarqube:
    image: sonarqube:lts-community
    profiles:
      - infra
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONARQUBE_DB_NAME}
      SONAR_JDBC_USERNAME: ${SONARQUBE_DB_USERNAME}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD}
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/localhost/9000' 2>/dev/null"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - buy01-network

  sonarqube-webhook-provisioner:
    image: curlimages/curl:latest
    profiles:
      - infra
    restart: "no"
    depends_on:
      sonarqube:
        condition: service_healthy
      jenkins-master:
        condition: service_started
    env_file:
      - .env
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      # The webhook URL is the address SonarQube itself will POST to, so it must be
      # resolvable from the sonarqube container — not the browser-facing JENKINS_URL
      # in .env, whose `localhost` would point SonarQube back at itself. Overridden
      # here rather than in .env because JENKINS_URL is also consumed by the JCasC
      # `location.url` and the GitHub hookUrl, which do need the external address.
      JENKINS_URL: http://jenkins-master:8080/
    volumes:
      - ./scripts/provision-sonar-webhook.sh:/provision.sh:ro
    entrypoint: ["/bin/sh", "/provision.sh"]
    networks:
      - buy01-network

networks:
  buy01-network:
    driver: bridge

volumes:
  users_mongo_data:
  products_mongo_data:
  media_mongo_data:
  jenkins_home:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
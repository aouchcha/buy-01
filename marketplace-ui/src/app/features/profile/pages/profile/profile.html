<app-navbar></app-navbar>

<section class="profile-page">
  <div class="profile-card">

    <div class="profile-banner">
      <img
        src="assets/images/background.png"
        alt=""
        class="banner-img"
      />

      <div class="banner-overlay">
        <h1>My Profile</h1>
        <p class="subtitle">
          Manage your account information and profile picture.
        </p>
      </div>
    </div>

    <div class="banner-seam"></div>

    <div class="profile-content">

    @if (loading()) {
      <p class="state-message">Loading profile...</p>
    }

    @else if (error()) {
      <p class="state-message error">
        {{ error() }}
      </p>
    }

    @else if (profile(); as user) {

      <div class="avatar-section avatar-overlap">
        <img
          [src]="user.profilePictureUrl || defaultAvatar"
          (error)="onAvatarError($event)"
          alt="Profile picture"
          class="avatar"
        />

        <label class="upload-btn">
          Change photo
          <input
            type="file"
            accept="image/*"
            hidden
            (change)="onAvatarSelected($event)"
          />
        </label>
      </div>

      <div class="edit-toggle">
        @if (!isEditing()) {
          <button type="button" class="btn-edit" (click)="startEditing()">
            ✎ Edit profile
          </button>
        } @else {
          <button type="button" class="btn-cancel" (click)="cancelEditing()">
            Cancel
          </button>
        }
      </div>

      <div class="form-grid">

        <div class="form-group">
          <label>First name</label>

          <input
            type="text"
            [ngModel]="user.firstName"
            (ngModelChange)="updateFirstName($event)"
            [readonly]="!isEditing()"
            [class.readonly]="!isEditing()"
          />
        </div>

        <div class="form-group">
          <label>Last name</label>

          <input
            type="text"
            [ngModel]="user.lastName"
            (ngModelChange)="updateLastName($event)"
            [readonly]="!isEditing()"
            [class.readonly]="!isEditing()"
          />
        </div>

        <div class="form-group full-width">
          <label>Email</label>

          <input
            type="email"
            [ngModel]="user.email"
            (ngModelChange)="updateEmail($event)"
            [readonly]="!isEditing()"
            [class.readonly]="!isEditing()"
          />
        </div>

        <div class="form-group full-width">
          <label>Role</label>
          
          <div class="role-picker">
            <button
              type="button"
              class="role-option"
                [class.active]="user.role.toLocaleLowerCase() === Role.CLIENT"
              [disabled]="!isEditing()"
              (click)="updateRole(Role.CLIENT)"
            >
              Buyer
            </button>

            <button
              type="button"
              class="role-option"
             [class.active]="user.role.toLocaleLowerCase() === Role.SELLER"
              [disabled]="!isEditing()"
              (click)="updateRole(Role.SELLER)"
            >
              Seller
            </button>
          </div>
        </div>

      </div>

      @if (isEditing()) {
        <button
          class="btn-save"
          [disabled]="saving()"
          (click)="saveProfile()"
        >
          {{ saving() ? 'Saving...' : 'Save Changes' }}
        </button>
      }

    } @else {
      <p class="state-message">
        Profile not found.
      </p>
    }

    </div>

  </div>
</section>

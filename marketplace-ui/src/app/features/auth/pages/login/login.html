<section class="login-page">
  <div class="background-orb orb-1"></div>
  <div class="background-orb orb-2"></div>

  <div class="login-container">
    <div class="login-card">
      <img
        src="assets/images/logo.png"
        alt="RoosterNest"
        class="logo"
      />

      <span class="brand">Welcome Back</span>

      <h1>Sign in to RoosterNest</h1>

      <p class="subtitle">
        Buy and sell healthy birds from trusted breeders.
      </p>

      @if (error()) {
        <div class="error-box">
          {{ error() }}
        </div>
      }

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Email</label>

          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label>Password</label>

          <div class="password-wrapper">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              placeholder="Password"
              required
            />

            <button
              type="button"
              class="toggle-password"
              (click)="togglePassword()"
            >
              {{ showPassword() ? 'Hide' : 'Show' }}
            </button>
          </div>
        </div>

        <button
          class="btn-login"
          type="submit"
          [disabled]="loading()"
        >
          {{ loading() ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>

      <p class="register">
        Don't have an account?
        <a routerLink="/register">Create one</a>
      </p>
    </div>

    <div class="hero-side">
      <img
        src="assets/images/logo.png"
        alt="RoosterNest"
      />

      <h2>Premium Bird Marketplace</h2>

      <p>
        Discover chickens, pigeons, ostriches and exotic birds
        from trusted breeders across Morocco.
      </p>
    </div>
  </div>
</section>

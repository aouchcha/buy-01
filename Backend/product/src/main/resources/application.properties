spring.application.name=product-service

server.port=8083
management.server.port=9000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

















spring.mongodb.uri=${PRODUCT_DB_URI}
spring.data.mongodb.auto-index-creation=true

eureka.client.service-url.defaultZone=http://discovery:8761/eureka/

spring.kafka.bootstrap-servers=kafka:29092
spring.kafka.consumer.group-id=product-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=Product.Service.dto.kafka.*
spring.kafka.consumer.properties.spring.json.type.mapping=productImageUploaded:Product.Service.dto.kafka.ProductImageUploadedEvent

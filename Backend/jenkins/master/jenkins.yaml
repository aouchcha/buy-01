jenkins:
  systemMessage: "Jenkins controller — configured entirely as code"
  numExecutors: 0        # the controller does no building itself; all work goes to agents
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USERNAME}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    globalMatrix:
      permissions:
        - "Overall/Administer:${JENKINS_ADMIN_USERNAME}"

  nodes:
    - permanent:
        name: "backend-slave"
        nodeDescription: "Backend build agent"
        labelString: "backend"
        numExecutors: 2
        remoteFS: "/home/jenkins/agent"
        mode: NORMAL
        launcher:
          inbound:
            workDirSettings:
              disabled: false

    - permanent:
        name: "frontend-slave"
        nodeDescription: "Frontend build agent"
        labelString: "frontend"
        numExecutors: 2
        remoteFS: "/home/jenkins/agent"
        mode: NORMAL
        launcher:
          inbound:
            workDirSettings:
              disabled: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-access-token"
              username: "${GITHUB_USERNAME}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub token used to check out code and report build status"
          - usernamePassword:
              scope: GLOBAL
              id: "smtp-credentials"
              username: "${SMTP_USERNAME}"
              password: "${SMTP_PASSWORD}"
              description: "SMTP login used by Jenkins to send build notification emails"
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              secret: "${SONARQUBE_TOKEN}"
              description: "SonarQube analysis token"
          # - string:
          #     scope: GLOBAL
          #     id: "notification-email"
          #     secret: "${SMTP_USERNAME}"

unclassified:
  mailer:
    smtpHost: "${SMTP_HOST}"
    smtpPort: "${SMTP_PORT}"
    useSsl: false
    useTls: true
    charset: "UTF-8"
    authentication:
      username: "${SMTP_USERNAME}"
      password: "${SMTP_PASSWORD}"

  location:
    url: "${JENKINS_URL}"
    adminAddress: "${SMTP_USERNAME}"

  sonarGlobalConfiguration:
    buildWrapperEnabled: false
    installations:
      - name: "sonarqube-server"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonarqube-token"

jobs:
  - script: |
      multibranchPipelineJob('buy01') {
        branchSources {
          branchSource {
            source {
              github {
                id('buy01-source')
                repoOwner('aouchcha')
                repository('buy-01')
                // repositoryUrl + configuredByUrl are BOTH required: they are
                // parameters of GitHubSCMSource's @DataBoundConstructor, so Job DSL
                // refuses to build the source without them. configuredByUrl(false)
                // means "use repoOwner/repository above", not the URL.
                repositoryUrl('https://github.com/aouchcha/buy-01')
                configuredByUrl(false)
                credentialsId('github-access-token')
                traits {
                  // Discover all branches, then narrow down to just "main" below.
                  gitHubBranchDiscovery {
                    strategyId(3)
                  }
                  // Build PRs by merging the PR head with the current target branch.
                  gitHubPullRequestDiscovery {
                    strategyId(1)
                  }
                  // Keep only the "main" branch and PR heads (e.g. "PR-42");
                  // all other feature branches are excluded from indexing/build.
                  headRegexFilter {
                    regex('^(main|PR-\\d+)$')
                  }
                }
              }
            }
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(20)
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('1440')   // once-a-day safety-net poll; the webhook handles real-time triggers
          }
        }
      }
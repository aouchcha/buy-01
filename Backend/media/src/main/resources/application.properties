spring.application.name=media-service
server.port=8082
management.server.port=9000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.mongodb.uri=${MEDIA_DB_URI}

eureka.client.service-url.defaultZone=http://discovery:8761/eureka/

spring.kafka.bootstrap-servers=kafka:29092

cloudflare.r2.access-key=${AWS_ACCESS_KEY_ID}
cloudflare.r2.secret-key=${AWS_SECRET_ACCESS_KEY}
cloudflare.r2.bucket=${R2_BUCKET}
cloudflare.r2.endpoint=${R2_ENDPOINT}
cloudflare.r2.public-url=${R2_PUBLIC_URL}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB




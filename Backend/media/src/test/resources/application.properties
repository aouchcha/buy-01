# Test-only configuration used by the @SpringBootTest context-load smoke test.
# Production values are provided at runtime via environment variables (docker-compose);
# here we only need syntactically valid placeholders so the ApplicationContext can start
# without a live MongoDB/Kafka/Eureka/R2 backend.
spring.mongodb.uri=mongodb://localhost:27017/media-test

cloudflare.r2.access-key=test-access-key
cloudflare.r2.secret-key=test-secret-key
cloudflare.r2.bucket=test-bucket
cloudflare.r2.endpoint=https://test.r2.cloudflarestorage.com
cloudflare.r2.public-url=https://test-public-url.example.com

spring.kafka.bootstrap-servers=localhost:9092

eureka.client.enabled=false

spring.application.name=orders

spring.data.mongodb.uri=${ORDERS_DB_URI}
spring.data.mongodb.auto-index-creation=true


eureka.client.service-url.defaultZone=http://discovery:8761/eureka/

# Automatic order status simulation (seconds for delays, ms for poll interval)
order.simulation.confirmed-delay=30
order.simulation.shipped-delay=60
order.simulation.delivered-delay=90
order.simulation.poll-interval-ms=5000

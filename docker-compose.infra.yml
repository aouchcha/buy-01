  orders-mongodb:
    image: mongo:8.0
    profiles:
      - infra
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${ORDERS_DB_NAME}
      GLIBC_TUNABLES: "glibc.pthread.rseq=1"
    volumes:
      - orders_mongo_data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: >
        mongosh --quiet
        -u $$MONGO_INITDB_ROOT_USERNAME
        -p $$MONGO_INITDB_ROOT_PASSWORD
        --authenticationDatabase admin
        --eval "db.adminCommand('ping')"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - buy01-network

  # KRaft mode: Kafka acts as its own metadata quorum (combined broker +
  # controller, single node) — no Zookeeper service needed.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    profiles:
      - infra
    expose:
      - "29092"
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Fixed cluster ID for this single dev broker (same well-known example
      # value used in Apache Kafka's own KRaft quickstart docs).
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - buy01-network
    
  jenkins-master:
    build: ./Backend/jenkins/master
    profiles:
      - infra
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    expose:
      - "8080"
      - "50000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - buy01-network
    volumes:
      - jenkins_home:/var/jenkins_home # Persistent Jenkins data
      - /run/user/${USER_ID}/docker.sock:/var/run/docker.sock

  backend-slave:
    build: ./Backend/jenkins/backend-slave
    profiles:
      - infra
    env_file:
      - .env
    environment:
      JENKINS_URL: http://jenkins-master:8080
      JENKINS_AGENT_NAME: backend-slave
      JENKINS_SECRET: ${BACKEND_SLAVE_SECRET}
    volumes:
      - /run/user/${USER_ID}/docker.sock:/var/run/docker.sock
      - ./.env:/home/jenkins/.env
    group_add:
      - "999"
    depends_on:
      jenkins-master:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - buy01-network

  frontend-slave:
    build: ./Backend/jenkins/frontend-slave
    profiles:
      - infra
    env_file:
      - .env
    environment:
      JENKINS_URL: http://jenkins-master:8080
      JENKINS_AGENT_NAME: frontend-slave
      JENKINS_SECRET: ${FRONTEND_SLAVE_SECRET}
    volumes:
      - /run/user/${USER_ID}/docker.sock:/var/run/docker.sock
      - ./.env:/home/jenkins/.env
    group_add:
      - "999"
    depends_on:
      jenkins-master:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - buy01-network

  sonarqube-db:
    image: postgres:17
    profiles:
      - infra
    environment:
      - POSTGRES_USER=${SONARQUBE_DB_USERNAME}
      - POSTGRES_PASSWORD=${SONARQUBE_DB_PASSWORD}
      - POSTGRES_DB=${SONARQUBE_DB_NAME}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - buy01-network

  sonarqube:
    image: sonarqube:latest
    profiles:
      - infra
    depends_on:
      - sonarqube-db
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      - SONAR_JDBC_URL=${SONARQUBE_DB_URI}
      - SONAR_JDBC_USERNAME=${SONARQUBE_DB_USERNAME}
      - SONAR_JDBC_PASSWORD=${SONARQUBE_DB_PASSWORD}
      - SONAR_SEARCH_JAVAOPTS=-Xmx512m -Xms512m
    restart: unless-stopped
    ports:
      - "9001:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - buy01-network

  nexus:
    image: sonatype/nexus3:latest
    profiles:
      - infra
    restart: unless-stopped
    # The sonatype/nexus3 image already runs as its built-in "nexus" user
    # (uid/gid 200), not root — pinned explicitly here so it's auditable.
    user: "200:200"
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms1200m -Xmx1200m -XX:MaxDirectMemorySize=2g
    ports:
      - "8081:8081"   # Nexus UI + Maven repositories (maven-public, maven-releases, maven-snapshots)
      - "8082:8082"   # docker-hosted repository connector (docker login/push/pull)
    expose:
      - "8081"
      - "8082"
    volumes:
      - nexus_data:/nexus-data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - buy01-network

networks:
  buy01-network:
    driver: bridge

volumes:
  users_mongo_data:
  products_mongo_data:
  media_mongo_data:
  jenkins_home:
  sonarqube_db_data:
  sonarqube_data:
  nexus_data:
  sonarqube_logs:
  sonarqube_extensions:
  orders_mongo_data:
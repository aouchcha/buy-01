services:
  users-mongodb:
    image: mongo:8.0
    profiles:
      - infra
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${USERS_DB_NAME}
      GLIBC_TUNABLES: "glibc.pthread.rseq=1"
    volumes:
      - users_mongo_data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: >
        mongosh --quiet
        -u $$MONGO_INITDB_ROOT_USERNAME
        -p $$MONGO_INITDB_ROOT_PASSWORD
        --authenticationDatabase admin
        --eval "db.adminCommand('ping')"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - buy01-network

  products-mongodb:
    image: mongo:8.0
    profiles:
      - infra
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${PRODUCTS_DB_NAME}
      GLIBC_TUNABLES: "glibc.pthread.rseq=1"
    volumes:
      - products_mongo_data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: >
        mongosh --quiet
        -u $$MONGO_INITDB_ROOT_USERNAME
        -p $$MONGO_INITDB_ROOT_PASSWORD
        --authenticationDatabase admin
        --eval "db.adminCommand('ping')"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - buy01-network

  media-mongodb:
    image: mongo:8.0
    profiles:
      - infra
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${MEDIA_DB_NAME}
      GLIBC_TUNABLES: "glibc.pthread.rseq=1"
    volumes:
